<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contorno Telefono + Coordinate</title>
  <style>
    :root {
      --page-bg-1: #f7f4eb;
      --page-bg-2: #e6eef7;
      --ink: #182026;
      --phone-body: #111418;
      --screen-bg: #fdfdfb;

      --phone-w: 320px;
      --phone-h: 640px;
      --frame: 14px;
      --screen-radius: 32px;
      --notch-w: 120px;
      --notch-h: 28px;
      --menu-bg: linear-gradient(180deg, rgba(210, 32, 38, 0.96), rgba(170, 16, 24, 0.98));
      --menu-border: rgba(143, 10, 18, 0.52);
      --menu-active: #ffffff;
      --menu-text: rgba(255, 241, 241, 0.86);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 24px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 15% 10%, rgba(255, 255, 255, 0.75), transparent 60%),
        radial-gradient(900px 600px at 85% 90%, rgba(162, 192, 230, 0.35), transparent 60%),
        linear-gradient(140deg, var(--page-bg-1), var(--page-bg-2));
      padding: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 1.8vw, 1.6rem);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .phone {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 46px;
      background: linear-gradient(145deg, #262d35, var(--phone-body));
      box-shadow:
        0 28px 70px rgba(15, 22, 34, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 -8px 24px rgba(0, 0, 0, 0.38);
      padding: var(--frame);
      isolation: isolate;
    }

    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      right: -3px;
      width: 3px;
      border-radius: 8px;
      background: #313842;
    }

    .phone::before {
      top: 140px;
      height: 72px;
    }

    .phone::after {
      top: 228px;
      height: 52px;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--screen-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.7) 45%, rgba(230, 235, 240, 0.95) 100%),
        var(--screen-bg);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--notch-w);
      height: var(--notch-h);
      background: #0b0e12;
      border-radius: 0 0 16px 16px;
      z-index: 4;
    }

    .menu-content {
      flex: 1;
      padding: 58px 18px 88px;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      text-align: left;
      color: #1d2935;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .menu-content::-webkit-scrollbar {
      display: none;
    }

    .menu-content h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .menu-content p {
      margin: 0;
      color: #4a5a6a;
      font-size: 14px;
      line-height: 1.4;
    }

    .sheet {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(22, 31, 41, 0.1);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .sheet.single-focus {
      margin: auto 0;
      padding: 16px;
      background: rgba(255, 255, 255, 0.9);
    }

    .sheet h2 {
      margin: 0;
      font-size: 18px;
    }

    .sheet-sub {
      margin: 4px 0 10px;
      font-size: 12px;
      color: #5c6b79;
    }

    .single-focus .sheet-sub {
      margin-bottom: 14px;
    }

    .field-grid {
      display: grid;
      gap: 8px;
    }

    .field-row {
      display: grid;
      gap: 6px;
    }

    .field-row label {
      font-size: 11px;
      letter-spacing: 0.03em;
      font-weight: 800;
      color: #2d3a46;
    }

    .field-row input,
    .field-row select,
    .field-row textarea {
      width: 100%;
      border: 1px solid rgba(29, 41, 53, 0.18);
      border-radius: 10px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 12px;
      color: #182026;
      background: rgba(255, 255, 255, 0.95);
    }

    .field-row textarea {
      min-height: 58px;
      resize: vertical;
    }

    .num-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .num-key {
      border: 1px solid rgba(29, 41, 53, 0.18);
      border-radius: 10px;
      background: #ffffff;
      color: #1d2935;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 0;
      cursor: pointer;
    }

    .num-key:active {
      transform: translateY(1px);
      background: rgba(26, 115, 232, 0.08);
    }

    .farmaco-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(26, 115, 232, 0.07);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    .farmaco-del {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .farmaco-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .farmaco-chip {
      border: 1.5px solid rgba(26, 115, 232, 0.35);
      border-radius: 20px;
      background: #fff;
      color: #1d2935;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .farmaco-info-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(26, 115, 232, 0.45);
      background: #fff;
      color: #1a73e8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .farmaco-info-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(26, 115, 232, 0.25);
      color: rgba(26, 115, 232, 0.55);
      pointer-events: none;
    }

    .farmaco-info-btn:active {
      transform: translateY(1px);
      background: rgba(26, 115, 232, 0.1);
    }

    .farmaco-chip--active {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    .farmaco-info-modal {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 14px;
    }

    .farmaco-info-modal.is-open {
      display: flex;
    }

    .farmaco-info-card {
      width: 100%;
      max-width: 280px;
      max-height: 82vh;
      overflow: auto;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(29, 41, 53, 0.14);
      box-shadow: 0 18px 40px rgba(17, 24, 39, 0.26);
      padding: 12px;
    }

    .farmaco-info-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .farmaco-info-title {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      color: #1d2935;
    }

    .farmaco-info-close {
      border: 0;
      border-radius: 8px;
      background: rgba(29, 41, 53, 0.08);
      color: #344250;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      width: 24px;
      height: 24px;
      line-height: 1;
      padding: 0;
    }

    .farmaco-info-card p {
      margin: 8px 0;
      font-size: 12px;
      line-height: 1.42;
      color: #2f3b47;
    }

    .single-focus input {
      padding: 12px 12px;
      font-size: 13px;
      border-radius: 12px;
    }

    .map-frame-wrap {
      margin-top: 10px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(21, 87, 176, 0.14);
      background: linear-gradient(180deg, rgba(238, 244, 251, 0.95), rgba(224, 234, 246, 0.95));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    .map-frame {
      display: block;
      width: 100%;
      height: 230px;
      border: 0;
      background: #eef3f9;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .form-btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, background-color 120ms ease;
    }

    .form-btn:hover {
      transform: translateY(-1px);
    }

    .form-btn.secondary {
      color: #405062;
      background: rgba(64, 80, 98, 0.12);
    }

    .form-btn.primary {
      color: #ffffff;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      box-shadow: 0 8px 18px rgba(26, 115, 232, 0.2);
    }

    .form-btn.danger {
      color: #ffffff;
      background: linear-gradient(135deg, #d93025, #a50e0e);
      box-shadow: 0 8px 18px rgba(169, 14, 14, 0.22);
    }

    .form-btn.map {
      color: #ffffff;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      box-shadow: 0 8px 18px rgba(27, 94, 32, 0.2);
    }

    .form-btn.emergency {
      color: #ffffff;
      background: linear-gradient(135deg, #c62828, #8e0000);
      box-shadow: 0 8px 18px rgba(142, 0, 0, 0.22);
    }

    .form-btn.central {
      color: #4a3400;
      background: linear-gradient(135deg, #ffe082, #ffca28);
      box-shadow: 0 8px 18px rgba(191, 144, 0, 0.2);
    }

    .step-panel {
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(29, 41, 53, 0.1);
      background: rgba(255, 255, 255, 0.82);
    }

    .step-panel[hidden] {
      display: none;
    }

    .step-panel-title {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #2d3a46;
    }

    .riepilogo-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(29,41,53,0.08);
    }

    .riepilogo-row:last-child {
      border-bottom: 0;
    }

    .riepilogo-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #7e1018;
      flex: 0 0 auto;
    }

    .riepilogo-value {
      font-size: 11px;
      font-weight: 600;
      color: #182026;
      text-align: right;
      word-break: break-word;
    }

    .gps-multiline {
      white-space: pre-line;
      line-height: 1.35;
    }

    .luoghi-menu {
      display: grid;
      gap: 8px;
    }

    .luogo-code-btn {
      border: 0;
      border-radius: 12px;
      padding: 7px 10px;
      width: 100%;
      font-family: inherit;
      cursor: pointer;
      color: #7e1018;
      background: rgba(210, 32, 38, 0.08);
      transition: transform 120ms ease, background-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .luogo-code-btn:hover {
      transform: translateY(-1px);
      background: rgba(210, 32, 38, 0.14);
    }

    .luogo-code-btn.active {
      color: #ffffff;
      background: linear-gradient(180deg, rgba(210, 32, 38, 0.96), rgba(170, 16, 24, 0.98));
      box-shadow: 0 8px 16px rgba(170, 16, 24, 0.24);
    }

    .luogo-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
      flex: 0 0 auto;
    }

    .luogo-code-btn.active .luogo-icon-wrap {
      background: rgba(255, 255, 255, 0.18);
    }

    .luogo-row-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .luogo-text {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .luogo-code {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .luogo-label {
      font-size: 10px;
      font-weight: 800;
    }

    .bottom-menu {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: 70px;
      padding: 8px;
      border-radius: 20px;
      border: 1px solid var(--menu-border);
      background: var(--menu-bg);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(170, 16, 24, 0.3);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .menu-btn {
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--menu-text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      line-height: 1;
      transition: transform 120ms ease, background-color 120ms ease, color 120ms ease;
    }

    .menu-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-label {
      font-size: 10px;
      letter-spacing: 0.01em;
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-right: 6px;
      vertical-align: -2px;
    }

    .menu-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.14);
    }

    .menu-btn.active {
      background: rgba(255, 255, 255, 0.22);
      color: var(--menu-active);
    }

    .panel {
      width: min(680px, 96vw);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(20, 30, 40, 0.08);
      font-size: 14px;
      line-height: 1.45;
    }

    .panel strong {
      display: block;
      margin-bottom: 4px;
    }

    @media (max-width: 520px) {
      :root {
        --phone-w: 270px;
        --phone-h: 540px;
      }

      .panel {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>

      <main class="menu-content" id="menu-content">
        <section></section>
      </main>

      <nav class="bottom-menu" aria-label="Menu inferiore">
        <button class="menu-btn active" data-title="Nuovo Intervento" data-description="Seleziona un pulsante in basso per cambiare sezione.">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v16"></path>
            <path d="M4 12h16"></path>
            <path d="M7 7h10v10H7z"></path>
          </svg>
          <span class="menu-label">Nuovo</span>
        </button>
        <button class="menu-btn" data-title="GPS" data-description="Qui puoi integrare localizzazione in tempo reale, mappa e navigazione.">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z"></path>
            <circle cx="12" cy="11" r="2.2"></circle>
          </svg>
          <span class="menu-label">GPS</span>
        </button>
        <button class="menu-btn" data-title="Missioni" data-description="Apre l'ultima missione di intervento salvata.">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 18.4l-5.5 3.1 1.2-6.2L3.2 11l6.3-.8L12 4.5l2.5 5.7 6.3.8-4.5 4.3 1.2 6.2z"></path>
          </svg>
          <span class="menu-label">Missioni</span>
        </button>
        <button class="menu-btn" data-title="Profilo" data-description="Gestione account, impostazioni e privacy.">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4"></circle>
            <path d="M5.5 19.5c1.6-3 3.6-4.5 6.5-4.5s4.9 1.5 6.5 4.5"></path>
          </svg>
          <span class="menu-label">Profilo</span>
        </button>
      </nav>
    </div>
  </div>

  <script>
    const menuButtons = document.querySelectorAll(".menu-btn");
    const menuContent = document.getElementById("menu-content");
    const INTERVENTI_STORAGE_KEY = "interventi_salvati";
    const PROFILE_STORAGE_KEY = "profilo_operatore";
    let gpsWatchId = null;
    let lastGpsFix = null;
    const interventoState = {
      luogo: "",
      luogoTipo: "",
      patologia: "",
      attivazione: "",
      note: "",
      cancello: ""
    };

    function getStoredInterventi() {
      try {
        const raw = localStorage.getItem(INTERVENTI_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function getStoredProfilo() {
      try {
        const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function saveProfiloToStorage(payload) {
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(payload || {}));
    }

    function saveInterventoToStorage(payload) {
      const existing = getStoredInterventi();
      existing.push(payload);
      localStorage.setItem(INTERVENTI_STORAGE_KEY, JSON.stringify(existing));
    }

    function getLatestIntervento() {
      const stored = getStoredInterventi();
      return stored.length ? stored[stored.length - 1] : null;
    }

    function deleteLatestIntervento() {
      const stored = getStoredInterventi();
      if (!stored.length) return false;
      stored.pop();
      localStorage.setItem(INTERVENTI_STORAGE_KEY, JSON.stringify(stored));
      return true;
    }

    function updateLatestIntervento(changes) {
      const stored = getStoredInterventi();
      if (!stored.length) return false;
      const lastIndex = stored.length - 1;
      stored[lastIndex] = { ...stored[lastIndex], ...changes };
      localStorage.setItem(INTERVENTI_STORAGE_KEY, JSON.stringify(stored));
      return true;
    }

    function formatDateDigits(digits) {
      const clean = (digits || "").replace(/\D/g, "").slice(0, 8);
      const day = clean.slice(0, 2);
      const month = clean.slice(2, 4);
      const year = clean.slice(4, 8);
      if (clean.length <= 2) return day;
      if (clean.length <= 4) return `${day}/${month}`;
      return `${day}/${month}/${year}`;
    }

    function normalizeDateForDisplay(value) {
      if (!value) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        const [year, month, day] = value.split("-");
        return `${day}/${month}/${year}`;
      }
      return formatDateDigits(value);
    }

    function newInterventoTemplate() {
      return `
        <section class="sheet single-focus">
          <h2>NUOVA MISSIONE</h2>
          <p class="sheet-sub"></p>

          <div class="field-grid" id="intervento-form">
            <div class="field-row">
              <label for="luogo-intervento">LUOGO INTERVENTO</label>
              <input id="luogo-intervento" type="text" placeholder="Es. Via Roma 21, Milano" />
            </div>

            <div class="map-frame-wrap">
              <iframe
                id="maps-embed"
                class="map-frame"
                title="Mappa Google incorporata"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps?q=Milano&z=12&t=k&output=embed"
              ></iframe>
            </div>

            <div class="form-actions">
              <button class="form-btn primary" id="next-intervento" type="button">AVANTI</button>
            </div>
          </div>
        </section>
      `;
    }

    function luoghiInterventoTemplate() {
      return `
        <section class="sheet single-focus">
          <h2>LUOGHI INTERVENTO</h2>

          <div class="step-panel">
            <div class="luoghi-menu" id="luoghi-menu">
              <button class="luogo-code-btn" type="button" data-code="S" data-label="STRADA">
                <span class="luogo-icon-wrap">

        backBtn.addEventListener("click", () => {
          menuContent.innerHTML = luoghiInterventoTemplate();
          bindLuoghiStep();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          const sel = patologiaMenu ? patologiaMenu.querySelector(".luogo-code-btn.active") : null;
          interventoState.patologia = sel ? sel.dataset.code : "";
          menuContent.innerHTML = codiceAttivazioneTemplate();
          bindCodiceAttivazioneStep();
        });
      }

      if (patologiaMenu) {
        patologiaMenu.addEventListener("click", (event) => {
          const target = event.target.closest(".luogo-code-btn");
          if (!target) return;
          patologiaMenu.querySelectorAll(".luogo-code-btn").forEach((b) => b.classList.remove("active"));
          target.classList.add("active");
        });
      }
    }

    function riepilogoTemplate() {
      const row = (label, value) => value
        ? `<div class="riepilogo-row"><span class="riepilogo-label">${label}</span><span class="riepilogo-value">${value}</span></div>`
        : ``;
      return `

          <h2>RIEPILOGO</h2>
          <div class="step-panel">
            ${row("LUOGO", interventoState.luogo)}
            ${row("TIPO LUOGO", interventoState.luogoTipo)}
            ${row("PATOLOGIA", interventoState.patologia)}
            ${row("ATTIVAZIONE", interventoState.attivazione)}
            ${row("NOTE", interventoState.note)}
            ${row("COD. CANCELLO", interventoState.cancello)}

          </div>

      `;
    }

    function bindRiepilogoStep() {
      const backBtn = document.getElementById("back-riepilogo");
      const inviaBtn = document.getElementById("invia-riepilogo");

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          menuContent.innerHTML = noteAggiuntiveTemplate();
          bindNoteAggiuntiveStep();
        });
      }

      if (inviaBtn) {
        inviaBtn.addEventListener("click", () => {
          const record = {
            id: `INT-${Date.now()}`,
            createdAt: new Date().toISOString(),
            luogo: interventoState.luogo,
            luogoTipo: interventoState.luogoTipo,
            patologia: interventoState.patologia,
            attivazione: interventoState.attivazione,
            note: interventoState.note,
            cancello: interventoState.cancello
          };

          saveInterventoToStorage(record);
          alert("Intervento salvato in locale.");
        });
      }
    }

    function bindArchivioMissioniStep() {
      // Scroll to top and focus search input
      window.scrollTo(0, 0);
      
      const searchInput = document.getElementById("archivio-search");
      const resultsContainer = document.getElementById("archivio-results");
      const noResultsEl = document.getElementById("archivio-no-results");
      const backBtn = document.getElementById("archivio-back-profile");

      if (searchInput) {
        searchInput.focus();
        searchInput.addEventListener("input", () => {
          const q = (searchInput.value || "").trim().toLowerCase();
          const panels = resultsContainer.querySelectorAll(".archivio-panel");
          let visibleCount = 0;

          panels.forEach((panel) => {
            const searchText = panel.dataset.search || "";
            const matches = !q || searchText.includes(q);
            panel.style.display = matches ? "" : "none";
            if (matches) visibleCount++;
          });

          noResultsEl.style.display = visibleCount === 0 && panels.length > 0 ? "" : "none";
        });
      }

      const apriButtons = resultsContainer.querySelectorAll(".archivio-apri-btn");
      apriButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const missionId = btn.dataset.id;
          const all = getStoredInterventi();
          const found = all.find((item) => item.id === missionId);

      return `
        <section class="sheet single-focus">

          <div class="step-panel">
            <div class="form-actions" style="grid-template-columns:1fr 1fr;margin-top:10px;">

            </div>
            <div class="riepilogo-row">
              <span class="riepilogo-label">GRADI</span>
              <span class="riepilogo-value gps-multiline" id="gps-dms-out">-</span>
            </div>
            <div class="riepilogo-row">
              <span class="riepilogo-label">ACCURATEZZA</span>
              <span class="riepilogo-value" id="gps-acc-out">-</span>
            </div>
          </div>

          <div class="form-actions" style="grid-template-columns:1fr;margin-top:10px;">
            <button class="form-btn secondary" id="gps-copy" type="button">COPIA COORD.</button>

    function bindGpsStep() {
      const detectBtn = document.getElementById("gps-detect");
      const manualBtn = document.getElementById("gps-apply-manual");
      const copyBtn = document.getElementById("gps-copy");
      const decOut = document.getElementById("gps-dec-out");
      const dmsOut = document.getElementById("gps-dms-out");
      const accOut = document.getElementById("gps-acc-out");
      const note = document.getElementById("gps-note");

      let current = null;

      function toDms(value, isLat) {
        const abs = Math.abs(value);
        const deg = Math.floor(abs);
        const minFloat = (abs - deg) * 60;
        const min = Math.floor(minFloat);
        const sec = Math.round((minFloat - min) * 60);
        const hemi = isLat ? (value >= 0 ? "N" : "S") : (value >= 0 ? "E" : "W");
        return `${deg}°${min}'${sec}" ${hemi}`;
      }

      function setPosition(lat, lng, accuracy) {
        current = { lat, lng, accuracy: typeof accuracy === "number" ? accuracy : null };
        lastGpsFix = { ...current };
        if (decOut) decOut.textContent = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
        dmsOut.textContent = `${toDms(lat, true)} | ${toDms(lng, false)}`;
        accOut.textContent = current.accuracy != null ? `${Math.round(current.accuracy)} m` : "-";
      }

      function onGeoSuccess(pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = pos.coords.accuracy;
        setPosition(lat, lng, acc);
      }

      function onGeoError(err) {
        let msg = `Errore geolocalizzazione: ${err.message}`;
        if (err && err.code === 1) msg = "Permesso posizione negato. Consenti la geolocalizzazione al browser.";
        if (err && err.code === 2) msg = "Posizione non disponibile. Controlla GPS/rete e riprova.";
        if (err && err.code === 3) msg = "Timeout geolocalizzazione. Riprova tra pochi secondi.";
        if (note) note.textContent = msg;
        alert(msg);
      }

      if (note) {
        if (window.location.protocol === "file:") {
          note.textContent = "";
        } else {
          note.textContent = "";
        }
      }

      if (manualBtn) {
        manualBtn.addEventListener("click", () => {
          const fix = current || lastGpsFix;
          if (!fix) {
            alert("Prima premi RILEVA POSIZIONE.");
            return;
          }
          const url = `https://www.google.com/maps?q=${fix.lat},${fix.lng}`;
          window.open(url, "_blank", "noopener,noreferrer");
        });
      }

      if (detectBtn) {
        detectBtn.addEventListener("click", () => {
          if (!navigator.geolocation) {
            alert("Geolocalizzazione non disponibile nel browser.");
            return;
          }

          const oldText = detectBtn.textContent;
          detectBtn.disabled = true;
          detectBtn.textContent = "RILEVAMENTO...";
          if (note) note.textContent = "";

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              onGeoSuccess(pos);
              if (note) note.textContent = "";
              detectBtn.disabled = false;
              detectBtn.textContent = oldText;
            },
            (err) => {
              onGeoError(err);
              detectBtn.disabled = false;
              detectBtn.textContent = oldText;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
          );
        });
      }

      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          const fix = current || lastGpsFix;
          if (!fix) {
            alert("Nessuna coordinata disponibile.");
            return;
          }
          const text = `${fix.lat.toFixed(2)}, ${fix.lng.toFixed(2)}`;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
              alert("Coordinate copiate.");
            } else {
              prompt("Copia coordinate:", text);
            }
          } catch {
            prompt("Copia coordinate:", text);
          }
        });
      }

      if (lastGpsFix) {
        setPosition(lastGpsFix.lat, lastGpsFix.lng, lastGpsFix.accuracy);
      }

      // Avvio su richiesta tramite RILEVA POSIZIONE.
    }

    function bindMissioniStep() {
      const deleteBtn = document.getElementById("delete-missione");
      const openBtn = document.getElementById("open-missione");
      const openMapBtn = document.getElementById("open-mission-map");
      const call112Btn = document.getElementById("mission-call-112");
      const callCentraleBtn = document.getElementById("mission-call-centrale");

      if (openMapBtn) {
        openMapBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          const luogo = latest && latest.luogo ? latest.luogo.trim() : "";
          if (!luogo) {
            alert("Luogo intervento non disponibile per aprire la mappa.");
            return;
          }
          const url = `https://www.google.com/maps?q=${encodeURIComponent(luogo)}`;
          window.open(url, "_blank", "noopener,noreferrer");
        });
      }

      if (call112Btn) {
        call112Btn.addEventListener("click", () => {
          window.location.href = "tel:112";
        });
      }

      if (callCentraleBtn) {
        callCentraleBtn.addEventListener("click", () => {
          const profilo = getStoredProfilo();
          const centrale = (profilo.numeroCentrale || "").trim();
          const normalized = centrale.replace(/\s+/g, "");
          if (!normalized) {
            alert("Numero Centrale non impostato nei setting Profilo.");
            return;
          }
          window.location.href = `tel:${normalized}`;
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener("click", () => {
          const ok1 = confirm("Vuoi eliminare l'ultima missione salvata?");
          if (!ok1) return;
          const ok2 = confirm("Conferma finale: eliminare definitivamente la missione?");
          if (!ok2) return;

          const removed = deleteLatestIntervento();
          if (removed) {
            alert("Missione eliminata.");
          } else {
            alert("Nessuna missione da eliminare.");
          }

          menuContent.innerHTML = missioniTemplate();
          bindMissioniStep();
        });
      }

      if (openBtn) {
        openBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          menuContent.innerHTML = missioneSchedaTemplate(latest);
          bindMissioneSchedaStep();
        });
      }
    }

    function bindMissioneSchedaStep() {
      const backBtn = document.getElementById("back-missioni");
      const saveBtn = document.getElementById("save-scheda");
      const dobInput = document.getElementById("paziente-data-nascita");
      const dobKeypad = document.getElementById("dob-keypad");
      const phoneInput = document.getElementById("paziente-telefono");
      const phoneKeypad = document.getElementById("phone-keypad");

      if (dobInput && dobKeypad) {
        dobKeypad.addEventListener("click", (event) => {
          const keyButton = event.target.closest(".num-key");
          if (!keyButton) return;

          const key = keyButton.dataset.key;
          const currentDigits = dobInput.value.replace(/\D/g, "");

          if (key === "clear") {
            dobInput.value = "";
            return;
          }

          if (key === "back") {
            dobInput.value = formatDateDigits(currentDigits.slice(0, -1));
            return;
          }

          if (/^\d$/.test(key)) {
            const nextDigits = (currentDigits + key).slice(0, 8);
            dobInput.value = formatDateDigits(nextDigits);

            if (nextDigits.length === 8 && phoneInput) {
              phoneInput.scrollIntoView({ behavior: "smooth", block: "end" });
              menuContent.scrollTo({ top: menuContent.scrollHeight, behavior: "smooth" });
            }
          }
        });
      }

      if (phoneInput && phoneKeypad) {
        phoneKeypad.addEventListener("click", (event) => {
          const keyButton = event.target.closest(".num-key");
          if (!keyButton) return;

          const key = keyButton.dataset.phoneKey;
          const current = phoneInput.value || "";

          if (key === "clear") {
            phoneInput.value = "";
            return;
          }

          if (key === "back") {
            phoneInput.value = current.slice(0, -1);
            return;
          }

          if (key === "+") {
            if (!current.includes("+") && !current.length) {
              phoneInput.value = "+";
            }
            return;
          }

          if (/^\d$/.test(key) && current.length < 16) {
            phoneInput.value = `${current}${key}`;
          }
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          menuContent.innerHTML = missioniTemplate();
          bindMissioniStep();
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          const payload = {
            valutazione: {
              cognomeNome: document.getElementById("paziente-cognome-nome")?.value.trim() || "",
              dataNascita: normalizeDateForDisplay(document.getElementById("paziente-data-nascita")?.value || ""),
              telefono: document.getElementById("paziente-telefono")?.value.trim() || ""
            }
          };
          updateLatestIntervento(payload);
          const latest = getLatestIntervento();
          menuContent.innerHTML = parametriVitaliTemplate(latest);
          bindParametriVitaliStep();
        });
      }
    }

    function parametriVitaliTemplate(record) {
      const v = (record && record.valutazione) ? record.valutazione : {};

      function vitKp(field) {
        return `
          <div class="num-keypad" id="kp-${field}">
            <button class="num-key" type="button" data-vit-key="1">1</button>
            <button class="num-key" type="button" data-vit-key="2">2</button>
            <button class="num-key" type="button" data-vit-key="3">3</button>
            <button class="num-key" type="button" data-vit-key="4">4</button>
            <button class="num-key" type="button" data-vit-key="5">5</button>
            <button class="num-key" type="button" data-vit-key="6">6</button>
            <button class="num-key" type="button" data-vit-key="7">7</button>
            <button class="num-key" type="button" data-vit-key="8">8</button>
            <button class="num-key" type="button" data-vit-key="9">9</button>
            <button class="num-key" type="button" data-vit-key="clear">C</button>
            <button class="num-key" type="button" data-vit-key="0">0</button>
            <button class="num-key" type="button" data-vit-key="back">⌫</button>
          </div>`;
      }

      return `
        <section class="sheet single-focus">
          <h2>PARAMETRI VITALI</h2>
          <div class="step-panel">
            <div class="field-row">
              <label for="vit-fc">FC (bpm)</label>
              <input id="vit-fc" type="text" readonly placeholder="Es. 80" value="${v.fc || ""}" />
              ${vitKp("fc")}
            </div>
            <div class="field-row" style="margin-top:8px;">
              <label for="vit-pa">PA (mmHg)</label>
              <input id="vit-pa" type="text" readonly placeholder="Es. 120/80" value="${v.pa || ""}" />
              ${vitKp("pa")}
            </div>
            <div class="field-row" style="margin-top:8px;">
              <label for="vit-spo2">SpO2 (%)</label>
              <input id="vit-spo2" type="text" readonly placeholder="Es. 98" value="${v.spo2 || ""}" />
              ${vitKp("spo2")}
            </div>
            <div class="field-row" style="margin-top:8px;">
              <label for="vit-temp">TEMPERATURA (°C)</label>
              <input id="vit-temp" type="text" readonly placeholder="Es. 36.6" value="${v.temp || ""}" />
              ${vitKp("temp")}
            </div>
            <div class="field-row" style="margin-top:8px;">
              <label for="vit-glicemia">GLICEMIA (mg/dL)</label>
              <input id="vit-glicemia" type="text" readonly placeholder="Es. 100" value="${v.glicemia || ""}" />
              ${vitKp("glicemia")}
            </div>
          </div>
          <div class="form-actions" style="grid-template-columns:1fr 1fr;margin-top:10px;">
            <button class="form-btn secondary" id="back-info-paziente" type="button">INDIETRO</button>
            <button class="form-btn primary" id="save-vitali" type="button">AVANTI</button>
          </div>
        </section>
      `;
    }

    function bindParametriVitaliStep() {
      const backBtn = document.getElementById("back-info-paziente");
      const saveBtn = document.getElementById("save-vitali");

      // Format helpers: receive raw digit string, return display string
      const vitFormat = {
        fc:       (d) => d,
        pa:       (d) => d.length > 3 ? d.slice(0, 3) + "/" + d.slice(3) : d,
        spo2:     (d) => d,
        temp:     (d) => d.length === 3 ? d.slice(0, 2) + "." + d[2] : d,
        glicemia: (d) => d
      };

      // Max digits per field
      const vitMax = { fc: 3, pa: 5, spo2: 3, temp: 3, glicemia: 3 };

      // Next field to scroll to when current is complete
      const vitNext = {
        fc: "vit-pa", pa: "vit-spo2", spo2: "vit-temp",
        temp: "vit-glicemia", glicemia: null
      };

      function setupVitField(field) {
        const input = document.getElementById("vit-" + field);
        const kp = document.getElementById("kp-" + field);
        if (!input || !kp) return;

        kp.addEventListener("click", (event) => {
          const btn = event.target.closest(".num-key");
          if (!btn) return;
          const key = btn.dataset.vitKey;
          const digits = input.value.replace(/\D/g, "");

          if (key === "clear") {
            input.value = "";
            return;
          }
          if (key === "back") {
            const nd = digits.slice(0, -1);
            input.value = nd ? vitFormat[field](nd) : "";
            return;
          }
          if (/^\d$/.test(key)) {
            const nd = (digits + key).slice(0, vitMax[field]);
            input.value = vitFormat[field](nd);
            if (nd.length === vitMax[field]) {
              const nextEl = document.getElementById(vitNext[field]);
              if (nextEl) {
                nextEl.scrollIntoView({ behavior: "smooth", block: "center" });
                if (nextEl.tagName === "TEXTAREA") nextEl.focus();
              }
            }
          }
        });
      }

      ["fc", "pa", "spo2", "temp", "glicemia"].forEach(setupVitField);

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          menuContent.innerHTML = missioneSchedaTemplate(latest);
          bindMissioneSchedaStep();
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          const existing = (latest && latest.valutazione) ? latest.valutazione : {};
          const payload = {
            valutazione: {
              ...existing,
              fc:         document.getElementById("vit-fc")?.value.trim() || "",
              pa:         document.getElementById("vit-pa")?.value.trim() || "",
              spo2:       document.getElementById("vit-spo2")?.value.trim() || "",
              temp:       document.getElementById("vit-temp")?.value.trim() || "",
              glicemia:   document.getElementById("vit-glicemia")?.value.trim() || ""
            }
          };
          const updated = updateLatestIntervento(payload);
          if (updated) {
            const latest2 = getLatestIntervento();
            menuContent.innerHTML = farmaciTemplate(latest2);
            bindFarmaciStep();
          } else {
            alert("Nessuna missione disponibile.");
          }
        });
      }
    }

    function farmaciTemplate(record) {
      const selected = (record && record.farmaci) ? record.farmaci : [];
      const categorie = [
        "Anticoagulanti",
        "Antiaggreganti",
        "Insulina / Antidiabetici",
        "Digossina",
        "Antiepilettico",
        "Benzodiazepine",
        "Oppioidi",
        "Adrenalina (EpiPen)"
      ];
      const chipsHtml = categorie.map(c => {
        const active = selected.includes(c) ? "farmaco-chip--active" : "";
        const disabled = active ? "" : "disabled";
        return `
          <div class="farmaco-row">
            <button class="farmaco-chip ${active}" type="button" data-cat="${c}">${c}</button>
            <button class="farmaco-info-btn" type="button" data-info-cat="${c}" aria-label="Info ${c}" ${disabled}>i</button>
          </div>`;
      }).join("");

      return `
        <section class="sheet single-focus">
          <h2>FARMACI</h2>
          <div class="step-panel">
            <div id="farmaci-chips" style="display:flex;flex-wrap:wrap;gap:7px;">
              ${chipsHtml}
            </div>
          </div>
          <div class="farmaco-info-modal" id="farmaci-info-modal">
            <div class="farmaco-info-card" role="dialog" aria-modal="true" aria-labelledby="farmaci-info-title">
              <div class="farmaco-info-head">
                <h3 class="farmaco-info-title" id="farmaci-info-title">Info farmaco</h3>
                <button class="farmaco-info-close" id="farmaci-info-close" type="button" aria-label="Chiudi">x</button>
              </div>
              <p id="farmaci-info-comuni"></p>
              <p id="farmaci-info-perche"></p>
              <p id="farmaci-info-rischi"></p>
            </div>
          </div>
          <div class="form-actions" style="grid-template-columns:1fr 1fr;margin-top:10px;">
            <button class="form-btn secondary" id="back-vitali" type="button">INDIETRO</button>
            <button class="form-btn primary" id="save-farmaci" type="button">AVANTI</button>
          </div>
        </section>
      `;
    }

    function bindFarmaciStep() {
      const backBtn = document.getElementById("back-vitali");
      const saveBtn = document.getElementById("save-farmaci");
      const chipsEl = document.getElementById("farmaci-chips");
      const modal = document.getElementById("farmaci-info-modal");
      const closeBtn = document.getElementById("farmaci-info-close");
      const titleEl = document.getElementById("farmaci-info-title");
      const comuniEl = document.getElementById("farmaci-info-comuni");
      const percheEl = document.getElementById("farmaci-info-perche");
      const rischiEl = document.getElementById("farmaci-info-rischi");

      const infoByCategoria = {
        "Anticoagulanti": {
          comuni: "Farmaci comuni: Warfarin (Coumadin), Apixaban (Eliquis), Rivaroxaban (Xarelto), Dabigatran (Pradaxa), Edoxaban (Lixiana).",
          perche: "Perche interessa: riducono la coagulazione per FA, TVP/EP, protesi valvolari.",
          rischi: "Rischi per soccorso/CO: trauma cranico anche minore, emorragie occulte, peggioramento rapido dello shock emorragico; da segnalare subito a medico e centrale."
        },
        "Antiaggreganti": {
          comuni: "Farmaci comuni: Cardioaspirina (ASA), Clopidogrel (Plavix), Ticagrelor (Brilique), Prasugrel (Efient).",
          perche: "Perche interessa: prevenzione eventi coronarici/cerebrovascolari, spesso in pazienti post-stent o con vasculopatia.",
          rischi: "Rischi per soccorso/CO: sanguinamento maggiore in trauma, epistassi/GI, gestione piu prudente in politrauma e pazienti fragili."
        },
        "Insulina / Antidiabetici": {
          comuni: "Farmaci comuni: insulina rapida/lenta, Metformina, Gliclazide, Glimepiride, Empagliflozin, Dapagliflozin.",
          perche: "Perche interessa: molte chiamate 118 sono ipoglicemie, alterazioni coscienza, disidratazione o infezioni su base diabetica.",
          rischi: "Rischi per soccorso/CO: ipoglicemia grave, crisi convulsive/coma; in pazienti in SGLT2 attenzione a chetoacidosi euglicemica (glicemia non molto alta)."
        },
        "Digossina": {
          comuni: "Farmaci comuni: Digossina (Lanoxin e equivalenti).",
          perche: "Perche interessa: usata in FA e scompenso, piu frequente in anziani con politerapia.",
          rischi: "Rischi per soccorso/CO: tossicita con aritmie/bradicardia, nausea, confusione; rischio aumentato con insufficienza renale o disidratazione."
        },
        "Antiepilettico": {
          comuni: "Farmaci comuni: Levetiracetam (Keppra), Valproato (Depakin), Carbamazepina (Tegretol), Lamotrigina, Lacosamide.",
          perche: "Perche interessa: orienta in crisi convulsive, stato post-critico, trauma e aderenza terapeutica.",
          rischi: "Rischi per soccorso/CO: sospensione o mancata assunzione aumenta recidive; attenzione a depressione del SNC se associati ad altri sedativi."
        },
        "Benzodiazepine": {
          comuni: "Farmaci comuni: Lorazepam (Tavor), Diazepam (Valium/Micropam), Alprazolam (Xanax), Clonazepam (Rivotril), Delorazepam (EN).",
          perche: "Perche interessa: ansiolitici/ipnotici molto diffusi, soprattutto in anziani e pazienti fragili.",
          rischi: "Rischi per soccorso/CO: sonnolenza, depressione respiratoria, cadute/traumi, peggioramento stato neurologico quando associate ad alcol o oppioidi."
        },
        "Oppioidi": {
          comuni: "Farmaci comuni: Morfina, Ossicodone (Oxycontin), Fentanil cerotto, Buprenorfina, Tramadolo, Tapentadolo.",
          perche: "Perche interessa: terapia del dolore cronico oncologico/non oncologico, frequente in pazienti complessi.",
          rischi: "Rischi per soccorso/CO: depressione respiratoria, miosi, riduzione coscienza, alto rischio se associati a benzodiazepine/alcol; possibile necessita di naloxone."
        },
        "Adrenalina (EpiPen)": {
          comuni: "Farmaci comuni: EpiPen, Jext, Fastjekt (adrenalina auto-iniettabile).",
          perche: "Perche interessa: segnala anafilassi nota/allergie severe e rischio di reazioni improvvise.",
          rischi: "Rischi per soccorso/CO: anafilassi con compromissione vie aeree e shock; priorita alta e precoce allerta centrale operativa."
        }
      };

      function getSelected() {
        return [...chipsEl.querySelectorAll(".farmaco-chip--active")].map(b => b.dataset.cat);
      }

      function openInfo(cat) {
        const info = infoByCategoria[cat];
        if (!info || !modal) return;
        titleEl.textContent = cat;
        comuniEl.textContent = info.comuni;
        percheEl.textContent = info.perche;
        rischiEl.textContent = info.rischi;
        modal.classList.add("is-open");
      }

      function closeInfo() {
        if (modal) modal.classList.remove("is-open");
      }

      function syncInfoButtons() {
        if (!chipsEl) return;
        chipsEl.querySelectorAll(".farmaco-row").forEach((row) => {
          const chip = row.querySelector(".farmaco-chip");
          const infoBtn = row.querySelector(".farmaco-info-btn");
          if (!chip || !infoBtn) return;
          infoBtn.disabled = !chip.classList.contains("farmaco-chip--active");
        });
      }

      if (chipsEl) {
        chipsEl.querySelectorAll(".farmaco-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            chip.classList.toggle("farmaco-chip--active");
            syncInfoButtons();
          });
        });

        chipsEl.querySelectorAll(".farmaco-info-btn").forEach((infoBtn) => {
          infoBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (infoBtn.disabled) return;
            const row = infoBtn.closest(".farmaco-row");
            const chip = row ? row.querySelector(".farmaco-chip") : null;
            const isActive = chip ? chip.classList.contains("farmaco-chip--active") : false;
            if (!isActive) return;
            openInfo(infoBtn.dataset.infoCat);
          });
        });

        syncInfoButtons();
      }

      if (closeBtn) {
        closeBtn.addEventListener("click", closeInfo);
      }

      if (modal) {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            closeInfo();
          }
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          updateLatestIntervento({ farmaci: getSelected() });
          const latest = getLatestIntervento();
          menuContent.innerHTML = parametriVitaliTemplate(latest);
          bindParametriVitaliStep();
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          updateLatestIntervento({ farmaci: getSelected() });
          const latest = getLatestIntervento();
          menuContent.innerHTML = ulterioriNoteTemplate(latest);
          bindUlterioriNoteStep();
        });
      }
    }

        <section class="sheet single-focus">
          <h2>ULTERIORI NOTE</h2>
          <div class="step-panel">
            <div class="field-row">

          </div>

    function codiceRilascioTemplate(record) {

      const op = (v, tone) => `
        <button class="luogo-code-btn ${current === v ? "active" : ""}" type="button" data-rilascio="${v}">

      return `

              ${op("BIANCO", "rgba(220,220,220,0.6)")}
              ${op("VERDE", "rgba(34,139,34,0.18)")}
              ${op("GIALLO", "rgba(234,179,8,0.18)")}

          </div>
        </section>

    function bindCodiceRilascioStep() {
      const menu = document.getElementById("rilascio-menu");
      const backBtn = document.getElementById("back-rilascio");
      const nextBtn = document.getElementById("next-rilascio");

      if (menu) {
        menu.addEventListener("click", (event) => {
          const target = event.target.closest(".luogo-code-btn");
          if (!target) return;
          menu.querySelectorAll(".luogo-code-btn").forEach((b) => b.classList.remove("active"));
          target.classList.add("active");
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          menuContent.innerHTML = ulterioriNoteTemplate(latest);
          bindUlterioriNoteStep();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          const selected = menu ? menu.querySelector(".luogo-code-btn.active") : null;
          updateLatestIntervento({
            codiceRilascio: selected ? selected.dataset.rilascio : ""
          });
          const latest = getLatestIntervento();
          menuContent.innerHTML = sceltaOspedaleTemplate(latest);
          bindSceltaOspedaleStep();
        });
      }
    }

    function sceltaOspedaleTemplate(record) {
      const profilo = getStoredProfilo();
      const raw = (profilo.ospedaliList || "").trim();
      const parsed = raw
        .split(/\r?\n|,|;/)
        .map((x) => x.trim())
        .filter(Boolean);
      const ospedali = [...new Set(parsed)];
      const selected = record && record.ospedaleDestinazione ? record.ospedaleDestinazione : "";

      const listHtml = ospedali.length
        ? ospedali.map((nome) => `
            <button class="luogo-code-btn ${selected === nome ? "active" : ""}" type="button" data-ospedale="${nome}">
              <span class="luogo-icon-wrap">
                <svg class="luogo-row-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 20h16"></path>
                  <path d="M6 20V9h12v11"></path>
                  <path d="M9 9V5h6v4"></path>
                  <path d="M10 13h1"></path>
                  <path d="M13 13h1"></path>
                </svg>
              </span>
              <span class="luogo-text"><span class="luogo-label">${nome}</span></span>
            </button>
          `).join("")
        : `<p class="sheet-sub" style="margin:0;">Nessun ospedale impostato nel Profilo.</p>`;

      return `
        <section class="sheet single-focus">
          <h2>OSPEDALE DESTINAZIONE</h2>
          <div class="step-panel">
            <div class="luoghi-menu" id="ospedali-menu">
              ${listHtml}
            </div>
          </div>
          <div class="form-actions" style="grid-template-columns:1fr 1fr;margin-top:10px;">
            <button class="form-btn secondary" id="back-ospedale" type="button">INDIETRO</button>
            <button class="form-btn primary" id="save-complete-mission" type="button">SALVA SCHEDA</button>
          </div>
        </section>
      `;
    }

    function bindSceltaOspedaleStep() {
      const menu = document.getElementById("ospedali-menu");
      const backBtn = document.getElementById("back-ospedale");
      const saveBtn = document.getElementById("save-complete-mission");

      if (menu) {
        menu.addEventListener("click", (event) => {
          const target = event.target.closest(".luogo-code-btn");
          if (!target) return;
          menu.querySelectorAll(".luogo-code-btn").forEach((b) => b.classList.remove("active"));
          target.classList.add("active");
        });
      }

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          const latest = getLatestIntervento();
          menuContent.innerHTML = codiceRilascioTemplate(latest);
          bindCodiceRilascioStep();
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          const selected = menu ? menu.querySelector(".luogo-code-btn.active") : null;
          updateLatestIntervento({
            ospedaleDestinazione: selected ? selected.dataset.ospedale : ""
          });
          alert("Scheda salvata.");
          menuContent.innerHTML = missioniTemplate();
          bindMissioniStep();
        });
      }
    }

    function bindInterventoForm() {
      const luogoInput = document.getElementById("luogo-intervento");
      const mapsEmbed = document.getElementById("maps-embed");
      const nextButton = document.getElementById("next-intervento");
      let inputTimer;

      function setEmbeddedMap(query, zoom = 15) {
        const safeQuery = query && query.trim() ? query.trim() : "Milano";
        const mapsUrl = `https://www.google.com/maps?q=${encodeURIComponent(safeQuery)}&z=${zoom}&t=k&output=embed`;
        mapsEmbed.src = mapsUrl;
      }

      if (luogoInput) {
        luogoInput.focus();
        luogoInput.addEventListener("input", () => {
          clearTimeout(inputTimer);

          const query = luogoInput.value.trim();
          if (!query) {
            setEmbeddedMap("Milano", 12);
            return;
          }

          inputTimer = setTimeout(() => {
            setEmbeddedMap(query);
          }, 350);
        });
      }

      if (nextButton) {
        nextButton.addEventListener("click", () => {
          interventoState.luogo = luogoInput.value.trim();
          luogoInput.blur();
          menuContent.innerHTML = luoghiInterventoTemplate();
          bindLuoghiStep();
        });
      }

      setEmbeddedMap(interventoState.luogo || "Milano", interventoState.luogo ? 15 : 12);
    }

    function bindLuoghiStep() {
      const luoghiMenu = document.getElementById("luoghi-menu");
      const backBtn = document.getElementById("back-luoghi");
      const nextBtn = document.getElementById("next-luoghi");

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          menuContent.innerHTML = newInterventoTemplate();
          bindInterventoForm();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          const sel = luoghiMenu ? luoghiMenu.querySelector(".luogo-code-btn.active") : null;
          interventoState.luogoTipo = sel ? (sel.dataset.code + (sel.dataset.label ? " - " + sel.dataset.label : "")) : "";
          menuContent.innerHTML = codPatologiaTemplate();
          bindCodPatologiaStep();
        });
      }

      if (luoghiMenu) {
        luoghiMenu.addEventListener("click", (event) => {
          const target = event.target;
          if (!target.classList.contains("luogo-code-btn")) {
            return;
          }

          luoghiMenu.querySelectorAll(".luogo-code-btn").forEach((button) => {
            button.classList.remove("active");
          });

          target.classList.add("active");
        });
      }
    }

    function renderSection(button) {
      stopGpsTracking();

      const title = button.dataset.title;
      const description = button.dataset.description;

      if (title === "Nuovo Intervento") {
        menuContent.innerHTML = newInterventoTemplate();
        bindInterventoForm();
        return;
      }

      if (title === "Missioni") {
        menuContent.innerHTML = missioniTemplate();
        bindMissioniStep();
        return;
      }

      if (title === "GPS") {
        menuContent.innerHTML = gpsTemplate();
        bindGpsStep();
        return;
      }

      if (title === "Profilo") {
        menuContent.innerHTML = profileTemplate();
        bindProfileStep();
        return;
      }

      menuContent.innerHTML = standardTemplate(title, description);
    }

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        menuButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        renderSection(button);
      });
    });

    const initialButton = document.querySelector(".menu-btn.active") || menuButtons[0];
    if (initialButton) {
      renderSection(initialButton);
    }
  </script>
</body>
</html>
